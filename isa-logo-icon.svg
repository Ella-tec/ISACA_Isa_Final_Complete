      <stop offset="0%" stop-color="#00a4e4"/>
      <stop offset="100%" stop-color="#07649d"/>
    </linearGradient>
    <linearGradient id="greenC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6cb33f"/>
