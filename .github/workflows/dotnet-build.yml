name: Build IsaChatApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Resolve the project from the checked-out workspace instead of assuming
      # an extra nested directory exists on the GitHub-hosted runner.
      - name: Locate solution or project
        shell: pwsh
        run: |
          $candidate = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File |
            Where-Object {
              ($_.Extension -in '.sln', '.slnx', '.csproj') -and
              $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
            } |
            Sort-Object @{
              Expression = {
                if ($_.Extension -in '.sln', '.slnx') { 0 } else { 1 }
              }
            }, FullName |
            Select-Object -First 1

          if (-not $candidate) {
            throw "No .sln, .slnx, or .csproj file was found under $env:GITHUB_WORKSPACE."
          }

          "PROJECT_PATH=$($candidate.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using project: $($candidate.FullName)"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore "$env:PROJECT_PATH"

      - name: Build
        shell: pwsh
        run: dotnet build "$env:PROJECT_PATH" --configuration Release --no-restore
