<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Isa">
  <!-- Rounded app tile (looks like a real web-app icon in the tab) -->
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2d5c"/>
      <stop offset="100%" stop-color="#131f42"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#tile)"/>
  <!-- White disc -->
  <circle cx="32" cy="32" r="20" fill="#ffffff"/>
  <!-- ISACA-style green C -->
  <path d="M42 32a10 10 0 1 1-10-10"
        fill="none"
        stroke="#6cb33f"
        stroke-width="7"
        stroke-linecap="round"/>
</svg>
