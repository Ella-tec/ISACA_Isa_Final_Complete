<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">ISACA Journey — overlapping blue and green C logo</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A4E4"/>
      <stop offset="100%" stop-color="#087DB5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31C48D"/>
      <stop offset="100%" stop-color="#159B6A"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#1D2D5C" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#1D2D5C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="30" fill="url(#glow)"/>
  <!-- Two overlapping C shapes, open to the right -->
  <path d="M 55.5 29.2 A 37 37 0 1 0 55.5 98.8"
        fill="none" stroke="url(#blue)" stroke-width="13"
        stroke-linecap="round" transform="rotate(-25 54 64)"/>
  <path d="M 78.5 29.2 A 37 37 0 1 0 78.5 98.8"
        fill="none" stroke="url(#green)" stroke-width="13"
        stroke-linecap="round" transform="rotate(-25 76 64)"/>
</svg>
